<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Друзья — старая соцсеть</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#333;font:14px Tahoma,Arial,sans-serif}a,button{cursor:pointer}header{background:#4b6b9c;color:#fff;padding:12px max(14px,calc((100% - 980px)/2));font-size:20px;font-weight:bold}.wrap{max-width:980px;margin:16px auto;display:grid;grid-template-columns:170px 1fr;gap:14px;padding:0 10px}.side,.panel{background:white;border:1px solid #d5dce5;border-radius:3px;padding:12px}.side a{display:block;padding:8px;color:#45688e;text-decoration:none}.side a:hover{background:#edf2f8}.panel{min-height:400px}.muted{color:#888;font-size:12px}.btn{border:0;background:#5b7fa8;color:white;padding:8px 13px;border-radius:3px}.btn.secondary{background:#e7edf4;color:#456}.field,textarea{width:100%;padding:10px;border:1px solid #cbd4df;border-radius:3px;margin:5px 0 12px;font:14px Tahoma}.auth{max-width:380px;margin:45px auto}.auth h2{color:#45688e}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.post,.user,.message{border-top:1px solid #e5eaf0;padding:13px 0}.avatar{width:58px;height:58px;object-fit:cover;background:#e4eaf1;float:left;margin-right:12px}.postbody{white-space:pre-wrap;margin:12px 0}.comment{margin:8px 0 0 35px;padding:7px;background:#f4f6f8}.row{display:flex;gap:8px;align-items:center}.row .field{margin:4px 0}.chatbox{height:300px;overflow:auto;background:#f6f8fa;padding:10px;margin-bottom:10px}.mine{text-align:right}.message{padding:7px}.hidden{display:none}@media(max-width:600px){.wrap{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:5px}.side a{white-space:nowrap}.auth{margin:20px 12px}}
</style></head><body><header>друзья.ру <span style="font-size:12px;font-weight:normal">— твоя старая добрая сеть</span></header>
<div id="auth" class="auth panel"><h2>Добро пожаловать!</h2><div class="tabs"><button class="btn" onclick="authMode('login')">Войти</button><button class="btn secondary" onclick="authMode('register')">Регистрация</button></div><div id="regFields" class="hidden"><input id="name" class="field" placeholder="Как тебя зовут?"><input id="age" class="field" type="number" placeholder="Возраст"></div><input id="login" class="field" placeholder="Логин"><input id="password" class="field" type="password" placeholder="Пароль (от 8 символов)"><button class="btn" onclick="authSubmit()">Продолжить</button><p id="authError" class="muted"></p><p class="muted">Тестовая сеть. Не используй здесь пароль от других сайтов.</p></div>
<div id="app" class="wrap hidden"><nav class="side"><a onclick="show('feed')">Моя страница</a><a onclick="show('people')">Люди</a><a onclick="show('chats')">Сообщения</a><a onclick="show('profile')">Редактировать профиль</a><a onclick="logout()">Выйти</a></nav><main id="main" class="panel"></main></div>
<script>
const API='/social/api';let me=null,mode='login',chatUser=null;
async function api(path,opts={}){const r=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
function authMode(m){mode=m;document.getElementById('regFields').classList.toggle('hidden',m!=='register');document.querySelectorAll('.tabs button')[0].className='btn '+(m==='login'?'':'secondary');document.querySelectorAll('.tabs button')[1].className='btn '+(m==='register'?'':'secondary')}
async function authSubmit(){let err=document.getElementById('authError');try{let d=await api('/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify({login:login.value,password:password.value,name:name.value,age:age.value})});me=d.user;start()}catch(e){err.textContent=e.message}}
async function start(){auth.classList.add('hidden');app.classList.remove('hidden');await show('feed')}
async function logout(){await api('/logout',{method:'POST'});me=null;app.classList.add('hidden');auth.classList.remove('hidden')}
function el(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function heading(t){main.innerHTML='';main.append(el('h2',t))}
async function show(page){chatUser=null;if(page==='feed'){heading('Новости');let form=el('div');let ta=el('textarea');ta.placeholder='Что у тебя нового?';let b=el('button','Опубликовать','btn');b.onclick=async()=>{try{await api('/posts',{method:'POST',body:JSON.stringify({body:ta.value})});show('feed')}catch(e){alert(e.message)}};form.append(ta,b);main.append(form);let d=await api('/feed');d.posts.forEach(p=>main.append(postCard(p)));if(!d.posts.length)main.append(el('p','Пока тихо. Напиши первый пост!','muted'))}
if(page==='people'){heading('Поиск людей');let input=el('input');input.className='field';input.placeholder='Имя или уникальный ID';let results=el('div');let b=el('button','Найти','btn');b.onclick=async()=>{results.innerHTML='';let d=await api('/users?q='+encodeURIComponent(input.value));d.users.forEach(u=>results.append(userRow(u)))};main.append(input,b,results);b.click()}
if(page==='chats'){heading('Сообщения');let d=await api('/chats');d.users.forEach(u=>main.append(userRow(u,true)));if(!d.users.length)main.append(el('p','Диалогов пока нет. Найди человека в разделе «Люди».','muted'))}
if(page==='profile'){heading('Моя страница');let n=el('input');n.className='field';n.value=me.name;let a=el('input');a.className='field';a.type='number';a.value=me.age;let f=el('input');f.type='file';f.accept='image/*';let b=el('button','Сохранить','btn');b.onclick=async()=>{try{let avatar=me.avatar;if(f.files[0]){if(f.files[0].size>1024*1024)throw Error('Фото максимум 1 МБ');avatar=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f.files[0])})}let d=await api('/profile',{method:'PUT',body:JSON.stringify({name:n.value,age:a.value,avatar})});me=d.user;alert('Сохранено')}catch(e){alert(e.message)}};main.append(el('p','Имя'),n,el('p','Возраст'),a,el('p','Фото профиля'),f,b,el('p','Твой уникальный ID: '+me.id+' · логин: '+me.login))}
}
function userRow(u,openChat=false){let box=el('div',undefined,'user');let im=el('img');im.className='avatar';im.src=u.avatar||'';box.append(im);let name=el('b',u.name);box.append(name,el('p','ID '+u.id+' · @'+u.login+' · '+u.age+' лет','muted'));let b=el('button',openChat?'Написать':'Открыть страницу','btn');b.onclick=()=>openChat?chat(u):profile(u.id);box.append(b);return box}
function postCard(p){let box=el('article',undefined,'post');box.append(userRow({id:p.user_id,name:p.name,login:p.login,age:'',avatar:p.avatar}));box.append(el('div',p.body,'postbody'));box.append(el('small',p.created_at,'muted'));p.comments.forEach(c=>box.append(el('div',c.name+': '+c.body,'comment')));let inp=el('input');inp.className='field';inp.placeholder='Комментарий';let b=el('button','Ответить','btn');b.onclick=async()=>{try{await api('/posts/'+p.id+'/comments',{method:'POST',body:JSON.stringify({body:inp.value})});show('feed')}catch(e){alert(e.message)}};box.append(inp,b);return box}
async function profile(id){let d=await api('/users/'+id);heading(d.user.name);main.append(userRow(d.user));d.posts.forEach(p=>main.append(postCard({...p,comments:[]})))}
async function chat(u){chatUser=u;heading('Диалог с '+u.name);let box=el('div',undefined,'chatbox');let d=await api('/messages/'+u.id);d.messages.forEach(m=>box.append(el('div',(m.sender_id===me.id?'Вы':m.sender_name)+': '+m.body,'message '+(m.sender_id===me.id?'mine':''))));main.append(box);let input=el('input');input.className='field';input.placeholder='Сообщение';let b=el('button','Отправить','btn');b.onclick=async()=>{try{await api('/messages/'+u.id,{method:'POST',body:JSON.stringify({body:input.value})});chat(u)}catch(e){alert(e.message)}};main.append(input,b)}
(async()=>{try{let d=await api('/me');if(d.user){me=d.user;start()}}catch(e){}})();
</script></body></html>
