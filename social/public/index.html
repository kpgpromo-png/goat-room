<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b6b9c">
<title>имбецилы.ру — старая добрая сеть</title>
<style>
:root{--blue:#4b6b9c;--blue2:#5b7fa8;--line:#d7e0eb;--bg:#e9edf2;--muted:#7b8795;--text:#273444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header{background:var(--blue);color:#fff;padding:13px max(14px,calc((100% - 1040px)/2));box-shadow:0 1px 3px #23354b55}.brand{font-size:21px;font-weight:bold}.tagline{font-size:12px;font-weight:normal;opacity:.85;margin-left:8px}.auth{width:min(420px,calc(100% - 24px));margin:34px auto}.panel,.side{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:0 1px 2px #25364a0b}.auth h2{color:#45688e;margin:0 0 16px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.btn{border:0;background:var(--blue2);color:white;padding:9px 14px;border-radius:3px;min-height:38px}.btn:disabled{opacity:.55;cursor:wait}.btn.secondary{background:#e7edf4;color:#456}.btn.light{background:#eef3f8;color:#456}.field,textarea{width:100%;padding:11px;border:1px solid #cbd4df;border-radius:3px;margin:5px 0 12px;background:#fff;color:var(--text)}textarea{min-height:88px;resize:vertical}.field:focus,textarea:focus{outline:2px solid #9db6d3;outline-offset:1px}.muted{color:var(--muted);font-size:12px}.error{color:#a33;background:#fff0f0;border:1px solid #f0cccc;padding:9px;border-radius:3px;margin:10px 0}.success{color:#27623b;background:#effaf2;border:1px solid #cce8d2;padding:9px;border-radius:3px;margin:10px 0}.hidden{display:none!important}.wrap{max-width:1040px;margin:16px auto;display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;padding:0 10px}.side{align-self:start;padding:8px}.side a{display:block;padding:11px 10px;color:#45688e;text-decoration:none;border-radius:3px;cursor:pointer}.side a:hover,.side a.active{background:#edf2f8}.side .exit{color:#9b5555}.main{min-width:0;min-height:420px}.main h2{font-size:19px;color:#45688e;margin:0 0 15px}.post,.user,.chat-item{border-top:1px solid #e5eaf0;padding:14px 0}.post:first-of-type,.user:first-of-type,.chat-item:first-of-type{border-top:0}.avatar{width:54px;height:54px;object-fit:cover;background:#e4eaf1;border-radius:3px;flex:0 0 54px}.avatar.placeholder{display:grid;place-items:center;color:#789;background:#e4eaf1;font-size:23px}.user-head{display:flex;gap:11px;align-items:center;min-width:0}.user-meta{min-width:0;flex:1}.user-meta p{margin:5px 0}.postbody{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;line-height:1.5}.post-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.comment{margin:8px 0 0 26px;padding:8px 10px;background:#f4f6f8;border-radius:3px;overflow-wrap:anywhere}.comment-form{display:flex;gap:8px;margin-top:10px}.comment-form .field{margin:0;min-width:0}.chatbox{height:min(55vh,440px);min-height:220px;overflow:auto;background:#f6f8fa;padding:10px;margin-bottom:10px;border:1px solid #e1e7ee;border-radius:3px}.message{padding:8px 10px;margin:6px 0;background:#fff;border:1px solid #e3e9ef;border-radius:7px;max-width:85%;width:fit-content;white-space:pre-wrap;overflow-wrap:anywhere}.message.mine{margin-left:auto;background:#e9f1fb}.message-form{display:flex;gap:8px}.message-form .field{margin:0;min-width:0}.empty{padding:24px 8px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .field{flex:1;min-width:150px;margin:0}.profile-photo{max-width:120px;max-height:120px;object-fit:cover;border-radius:4px;margin:8px 0}.counter{text-align:right;color:var(--muted);font-size:11px;margin-top:-8px;margin-bottom:10px}.loading{padding:22px;color:var(--muted)}@media(max-width:650px){header{padding:12px 14px}.wrap{grid-template-columns:1fr;margin:10px auto;gap:9px}.side{display:flex;overflow-x:auto;gap:2px;padding:5px;position:sticky;top:0;z-index:2}.side a{white-space:nowrap;padding:10px 11px}.side a.exit{margin-left:auto}.panel{padding:13px}.auth{margin:20px auto}.tagline{display:block;margin:3px 0 0}.main{min-height:300px}.chatbox{height:48vh}.comment-form{align-items:stretch}.comment-form .btn{padding:8px 10px}}
</style>
</head>
<body>
<header><div class="brand">имбецилы.ру <span class="tagline">— наша социальная сеть</span></div></header>

<section id="authView" class="auth panel">
  <h2>Добро пожаловать!</h2>
  <div class="tabs">
    <button id="loginTab" class="btn">Войти</button>
    <button id="registerTab" class="btn secondary">Регистрация</button>
  </div>
  <div id="authNotice" aria-live="polite"></div>
  <form id="authForm">
    <div id="registerFields" class="hidden">
      <label for="nameInput">Как тебя зовут?</label>
      <input id="nameInput" class="field" maxlength="40" autocomplete="name" placeholder="Имя">
      <label for="ageInput">Сколько тебе лет?</label>
      <input id="ageInput" class="field" type="number" min="13" max="120" inputmode="numeric" placeholder="Возраст">
    </div>
    <label for="loginInput">Логин</label>
    <input id="loginInput" class="field" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Например, ivan_2000" required>
    <label for="passwordInput">Пароль</label>
    <input id="passwordInput" class="field" type="password" minlength="8" maxlength="100" autocomplete="current-password" placeholder="Не менее 8 символов" required>
    <button id="authSubmit" class="btn" type="submit">Войти</button>
  </form>
  <p class="muted">Тестовая сеть. Не используй пароль от других сайтов.</p>
</section>

<div id="appView" class="wrap hidden">
  <nav class="side" aria-label="Главное меню">
    <a href="#" data-page="feed" class="active">Новости</a>
    <a href="#" data-page="people">Люди</a>
    <a href="#" data-page="chats">Сообщения</a>
    <a href="#" data-page="profile">Моя страница</a>
    <a href="#" id="logoutLink" class="exit">Выйти</a>
  </nav>
  <main id="mainView" class="panel main" aria-live="polite"><div class="loading">Загружаем…</div></main>
</div>

<script>
(function(){
'use strict';
const API = '/social/api';
const $ = id => document.getElementById(id);
const authView = $('authView');
const appView = $('appView');
const mainView = $('mainView');
const authForm = $('authForm');
const authNotice = $('authNotice');
const loginTab = $('loginTab');
const registerTab = $('registerTab');
const registerFields = $('registerFields');
const authSubmit = $('authSubmit');
const loginInput = $('loginInput');
const passwordInput = $('passwordInput');
const nameInput = $('nameInput');
const ageInput = $('ageInput');
let me = null;
let authMode = 'login';
let activePage = 'feed';
let busy = false;

async function api(path, options){
  const opts = options || {};
  let response;
  try {
    response = await fetch(API + path, {
      method: opts.method || 'GET',
      credentials: 'same-origin',
      headers: opts.body ? {'Content-Type':'application/json'} : {},
      body: opts.body,
      cache: 'no-store'
    });
  } catch (error) {
    throw new Error('Не удалось связаться с сервером. Проверь интернет и обнови страницу.');
  }
  const type = response.headers.get('content-type') || '';
  let data;
  if (type.includes('application/json')) data = await response.json();
  else {
    const raw = await response.text();
    throw new Error('Сервер вернул неожиданный ответ (' + response.status + '). Попробуй обновить страницу.');
  }
  if (!response.ok) throw new Error(data.error || 'Ошибка запроса (' + response.status + ').');
  return data;
}

function node(tag, text, className){
  const item = document.createElement(tag);
  if (text !== undefined && text !== null) item.textContent = String(text);
  if (className) item.className = className;
  return item;
}
function notice(target, message, kind){
  target.replaceChildren();
  if (message) target.append(node('div', message, kind || 'error'));
}
function button(text, action, className){
  const item = node('button', text, className || 'btn');
  item.type = 'button';
  item.addEventListener('click', action);
  return item;
}
function setAuthMode(mode){
  authMode = mode;
  const registering = mode === 'register';
  registerFields.classList.toggle('hidden', !registering);
  loginTab.className = registering ? 'btn secondary' : 'btn';
  registerTab.className = registering ? 'btn' : 'btn secondary';
  authSubmit.textContent = registering ? 'Создать страницу' : 'Войти';
  passwordInput.autocomplete = registering ? 'new-password' : 'current-password';
  notice(authNotice, '');
}
loginTab.addEventListener('click', () => setAuthMode('login'));
registerTab.addEventListener('click', () => setAuthMode('register'));

authForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (busy) return;
  busy = true;
  authSubmit.disabled = true;
  notice(authNotice, '');
  const payload = {
    login: loginInput.value.trim(),
    password: passwordInput.value,
    name: nameInput.value.trim(),
    age: ageInput.value
  };
  try {
    const result = await api('/' + authMode, {method:'POST', body:JSON.stringify(payload)});
    me = result.user;
    passwordInput.value = '';
    await enterApp();
  } catch (error) {
    notice(authNotice, error.message);
  } finally {
    busy = false;
    authSubmit.disabled = false;
  }
});

async function enterApp(){
  authView.classList.add('hidden');
  appView.classList.remove('hidden');
  await showPage('feed');
}
async function logout(){
  try { await api('/logout', {method:'POST'}); } catch (error) {}
  me = null;
  appView.classList.add('hidden');
  authView.classList.remove('hidden');
  loginInput.value = '';
  passwordInput.value = '';
  setAuthMode('login');
}
$('logoutLink').addEventListener('click', event => {event.preventDefault(); logout();});

document.querySelectorAll('[data-page]').forEach(link => {
  link.addEventListener('click', event => {
    event.preventDefault();
    showPage(link.dataset.page);
  });
});
function setActive(page){
  activePage = page;
  document.querySelectorAll('[data-page]').forEach(link => link.classList.toggle('active', link.dataset.page === page));
}
function heading(title){
  mainView.replaceChildren(node('h2', title));
}
function loading(){
  mainView.replaceChildren(node('div', 'Загружаем…', 'loading'));
}
function showError(error){
  const message = node('div', error.message || 'Что-то пошло не так.', 'error');
  mainView.prepend(message);
}
async function showPage(page){
  setActive(page);
  loading();
  try {
    if (page === 'feed') await renderFeed();
    else if (page === 'people') await renderPeople();
    else if (page === 'chats') await renderChats();
    else if (page === 'profile') renderOwnProfile();
  } catch (error) {
    heading('Не удалось загрузить страницу');
    showError(error);
    if (error.message.includes('Сессия закончилась')) logout();
  }
}
function avatar(user){
  if (user.avatar) {
    const img = node('img');
    img.className = 'avatar';
    img.alt = '';
    img.src = user.avatar;
    img.loading = 'lazy';
    img.onerror = () => { const fallback = node('div', '👤', 'avatar placeholder'); img.replaceWith(fallback); };
    return img;
  }
  return node('div', '👤', 'avatar placeholder');
}
function userRow(user, actionLabel, action){
  const box = node('div', null, 'user');
  const head = node('div', null, 'user-head');
  head.append(avatar(user));
  const meta = node('div', null, 'user-meta');
  meta.append(node('b', user.name));
  meta.append(node('p', 'ID ' + user.id + ' · @' + user.login + (user.age ? ' · ' + user.age + ' лет' : ''), 'muted'));
  head.append(meta);
  box.append(head);
  if (action) box.append(button(actionLabel, action, 'btn light'));
  return box;
}
function postCard(post, includeComments){
  const box = node('article', null, 'post');
  box.append(userRow({id:post.user_id, name:post.name, login:post.login, avatar:post.avatar}, 'Открыть страницу', () => renderUserProfile(post.user_id)));
  box.append(node('div', post.body, 'postbody'));
  box.append(node('small', post.created_at, 'muted'));
  if (includeComments) {
    (post.comments || []).forEach(comment => {
      box.append(node('div', comment.name + ': ' + comment.body, 'comment'));
    });
    const form = node('form', null, 'comment-form');
    const input = node('input');
    input.className = 'field';
    input.placeholder = 'Написать комментарий…';
    input.maxLength = 500;
    input.setAttribute('aria-label', 'Комментарий');
    const send = node('button', 'Ответить', 'btn');
    send.type = 'submit';
    form.append(input, send);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!input.value.trim()) return;
      send.disabled = true;
      try {
        await api('/posts/' + post.id + '/comments', {method:'POST', body:JSON.stringify({body:input.value})});
        await showPage('feed');
      } catch (error) { alert(error.message); send.disabled = false; }
    });
    box.append(form);
  }
  return box;
}
async function renderFeed(){
  heading('Новости');
  const form = node('form');
  const text = node('textarea');
  text.placeholder = 'Что у тебя нового?';
  text.maxLength = 2000;
  text.setAttribute('aria-label', 'Текст публикации');
  const count = node('div', '0 / 2000', 'counter');
  text.addEventListener('input', () => count.textContent = text.value.length + ' / 2000');
  const publish = node('button', 'Опубликовать', 'btn');
  publish.type = 'submit';
  form.append(text, count, publish);
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!text.value.trim()) return;
    publish.disabled = true;
    try {
      await api('/posts', {method:'POST', body:JSON.stringify({body:text.value})});
      await showPage('feed');
    } catch (error) { alert(error.message); publish.disabled = false; }
  });
  mainView.append(form);
  const data = await api('/feed');
  if (!data.posts.length) mainView.append(node('div', 'Пока здесь тихо. Напиши первый пост!', 'empty'));
  data.posts.forEach(post => mainView.append(postCard(post, true)));
}
async function renderPeople(){
  heading('Поиск людей');
  const form = node('form', null, 'toolbar');
  const input = node('input');
  input.className = 'field';
  input.placeholder = 'Имя или логин';
  input.maxLength = 40;
  const search = node('button', 'Найти', 'btn');
  search.type = 'submit';
  form.append(input, search);
  const results = node('div');
  async function find(){
    search.disabled = true;
    results.replaceChildren(node('div', 'Ищем людей…', 'loading'));
    try {
      const data = await api('/users?q=' + encodeURIComponent(input.value));
      results.replaceChildren();
      if (!data.users.length) results.append(node('div', 'Никого не нашли. Попробуй другое имя или логин.', 'empty'));
      data.users.forEach(user => results.append(userRow(user, 'Открыть страницу', () => renderUserProfile(user.id))));
    } catch (error) { results.replaceChildren(node('div', error.message, 'error')); }
    finally { search.disabled = false; }
  }
  form.addEventListener('submit', event => {event.preventDefault(); find();});
  mainView.append(form, results);
  await find();
}
async function renderChats(){
  heading('Сообщения');
  const data = await api('/chats');
  if (!data.users.length) {
    mainView.append(node('div', 'Диалогов пока нет. Найди человека в разделе «Люди» и открой его страницу.', 'empty'));
    return;
  }
  data.users.forEach(user => mainView.append(userRow(user, 'Открыть диалог', () => renderChat(user))));
}
async function renderChat(user){
  setActive('chats');
  loading();
  try {
    heading('Диалог с ' + user.name);
    const data = await api('/messages/' + user.id);
    const box = node('div', null, 'chatbox');
    if (!data.messages.length) box.append(node('div', 'Это начало вашей переписки.', 'empty'));
    data.messages.forEach(message => {
      box.append(node('div', (message.sender_id === me.id ? 'Вы' : message.sender_name) + ': ' + message.body, 'message ' + (message.sender_id === me.id ? 'mine' : '')));
    });
    const form = node('form', null, 'message-form');
    const input = node('input');
    input.className = 'field';
    input.placeholder = 'Сообщение…';
    input.maxLength = 2000;
    const send = node('button', 'Отправить', 'btn');
    send.type = 'submit';
    form.append(input, send);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!input.value.trim()) return;
      send.disabled = true;
      try { await api('/messages/' + user.id, {method:'POST', body:JSON.stringify({body:input.value})}); await renderChat(user); }
      catch (error) { alert(error.message); send.disabled = false; }
    });
    mainView.append(box, form);
    box.scrollTop = box.scrollHeight;
    input.focus({preventScroll:true});
  } catch (error) { heading('Не удалось открыть диалог'); showError(error); }
}
function renderOwnProfile(){
  heading('Моя страница');
  const form = node('form');
  const nameLabel = node('label', 'Имя');
  const name = node('input');
  name.className = 'field';
  name.maxLength = 40;
  name.value = me.name;
  const ageLabel = node('label', 'Возраст');
  const age = node('input');
  age.className = 'field';
  age.type = 'number';
  age.min = '13';
  age.max = '120';
  age.value = me.age;
  const photoLabel = node('label', 'Фото профиля (до 1 МБ)');
  const file = node('input');
  file.type = 'file';
  file.accept = 'image/png,image/jpeg,image/webp,image/gif';
  file.className = 'field';
  const preview = me.avatar ? node('img') : null;
  if (preview) {preview.src = me.avatar; preview.className = 'profile-photo';}
  file.addEventListener('change', () => {
    if (!file.files[0]) return;
    if (file.files[0].size > 1024 * 1024) { notice(status, 'Фото должно быть не больше 1 МБ.'); file.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      if (preview) preview.src = reader.result;
      else { const img = node('img'); img.className = 'profile-photo'; img.src = reader.result; file.after(img); }
    };
    reader.readAsDataURL(file.files[0]);
  });
  const save = node('button', 'Сохранить изменения', 'btn');
  save.type = 'submit';
  const status = node('div');
  const info = node('p', 'Твой уникальный ID: ' + me.id + ' · логин: @' + me.login, 'muted');
  form.append(nameLabel, name, ageLabel, age, photoLabel, file);
  if (preview) form.append(preview);
  form.append(save, status, info);
  form.addEventListener('submit', async event => {
    event.preventDefault();
    save.disabled = true;
    try {
      let avatarData = me.avatar || '';
      if (file.files[0]) avatarData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Не удалось прочитать фото.'));
        reader.readAsDataURL(file.files[0]);
      });
      const result = await api('/profile', {method:'PUT', body:JSON.stringify({name:name.value, age:age.value, avatar:avatarData})});
      me = result.user;
      notice(status, 'Изменения сохранены.', 'success');
    } catch (error) { notice(status, error.message); }
    finally { save.disabled = false; }
  });
  mainView.append(form);
}
async function renderUserProfile(id){
  setActive('people');
  loading();
  try {
    const data = await api('/users/' + id);
    heading(data.user.name);
    mainView.append(userRow(data.user, 'Написать сообщение', () => renderChat(data.user)));
    if (!data.posts.length) mainView.append(node('div', 'Публикаций пока нет.', 'empty'));
    data.posts.forEach(post => mainView.append(postCard(post, false)));
  } catch (error) { heading('Не удалось открыть страницу'); showError(error); }
}
async function boot(){
  try {
    const data = await api('/me');
    if (data.user) {
      me = data.user;
      await enterApp();
    }
  } catch (error) {
    notice(authNotice, error.message);
  }
}
boot();
})();
</script>
</body>
</html>
